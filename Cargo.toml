[workspace]
resolver = "2"
members = ["crates/ships-core", "crates/ships-render", "crates/ships-kindle", "crates/ships-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
ships-core = { path = "crates/ships-core" }
ships-render = { path = "crates/ships-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
